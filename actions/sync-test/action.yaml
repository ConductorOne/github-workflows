name: Connector Sync Test
description: Test syncing, granting, and revoking for a baton connector.

inputs:
  connector:
    description: 'Connector binary to test'
    required: true
  baton-entitlement:
    description: 'Entitlement ID to test. If connector supports provisioning, it will be revoked and granted.'
    required: true
  baton-principal:
    description: 'Principal ID to test.'
    required: true
  baton-principal-type:
    description: 'Type of principal to test. If not provided, will default to "user".'
    required: false
    default: 'user'
  sleep:
    description: 'Sleep time in seconds to wait after each write operation. If not provided, no sleep will be performed.'
    required: false
  required-secrets:
    description: |
      Comma- or newline-separated list of env var names that must be non-empty for
      this test to run. If any are empty (e.g. the workflow could not pull a fork
      secret, or the org secret has not been provisioned yet), the action logs a
      skip notice and exits 0 instead of failing on a missing-credential side
      effect (no grants returned, empty token, etc.).

      Example:
        required-secrets: BATON_NETLIFY_ACCESS_TOKEN
    required: false
  bad-credentials:
    description: |
      Env-file of invalid credentials for the unauthenticated sync check.
      Each line is NAME=value. When omitted, credential-like BATON_* env vars
      (and names listed in required-secrets) are set to "invalid". Override
      when dummy credentials must be well-formed (JWT, PEM, JSON key, etc.).

      Example:
        bad-credentials: |
          BATON_TOKEN=invalid
          BATON_PRIVATE_KEY=-----BEGIN PRIVATE KEY----- invalid -----END PRIVATE KEY-----
    required: false

runs:
  using: "composite"
  steps:
    - name: Download Baton
      uses: ConductorOne/github-workflows/actions/get-baton@v4

    - name: Auth Error
      env:
        BATON_CONNECTOR: ${{ inputs.connector }}
        REQUIRED_SECRETS: ${{ inputs.required-secrets }}
        BAD_CREDENTIALS: ${{ inputs.bad-credentials }}
      run: ${{ github.action_path }}/auth-error.sh
      shell: bash

    - name: Grant Revoke
      env:
        BATON_CONNECTOR: ${{ inputs.connector }}
        BATON_ENTITLEMENT: ${{ inputs.baton-entitlement }}
        BATON_PRINCIPAL: ${{ inputs.baton-principal }}
        BATON_PRINCIPAL_TYPE: ${{ inputs.baton-principal-type }}
        BATON: baton
        SLEEP: ${{ inputs.sleep }}
        REQUIRED_SECRETS: ${{ inputs.required-secrets }}
      run: ${{ github.action_path }}/grant-revoke.sh
      shell: bash
