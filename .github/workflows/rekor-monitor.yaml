name: Rekor identity monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Initialize the first checkpoint (first run only; no historical coverage)."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: rekor-identity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      MONITOR_VERSION: v0.0.0-20261019132539-47017b2379cb
      # Test-channel placeholder only; no webhook or production routing is configured.
      ALERT_CHANNEL: "#ops-testing-new-alerts"
    steps:
      - name: Checkout monitor adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Enforce runner CA trust
        uses: ./.github/actions/ca-trust-guard

      - name: Install locked Go toolchain
        uses: ./.github/actions/locked-tools
        with:
          tools: go

      - name: Restore newest valid monitor state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          set -euo pipefail
          mkdir -p monitor-state
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rekor-monitor.yaml" --jq '.id')"
          candidates="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=rekor-monitor-state&per_page=100" |
            jq -r '[.[].artifacts[] | select(.name == "rekor-monitor-state" and .expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[].workflow_run.id')"
          run_id=""
          candidate_dir=""
          trap 'if [ -n "$candidate_dir" ]; then rm -rf "$candidate_dir"; fi' EXIT
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            candidate_workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate" --jq '.workflow_id')"
            if [ "$candidate_workflow" = "$workflow_id" ]; then
              candidate_dir="$(mktemp -d "./.rekor-state.XXXXXX")"
              if gh run download "$candidate" --repo "$GITHUB_REPOSITORY" \
                --name rekor-monitor-state --dir "$candidate_dir" &&
                test -s "$candidate_dir/checkpoint.txt" &&
                test -s "$candidate_dir/reconciliation.json"; then
                rmdir monitor-state
                mv "$candidate_dir" monitor-state
                candidate_dir=""
                run_id="$candidate"
                break
              fi
              rm -rf "$candidate_dir"
              candidate_dir=""
            fi
          done <<< "$candidates"
          if [ -z "$run_id" ] && [ "$BOOTSTRAP" != true ]; then
            echo "::error::No monitor state exists; initialize once with the bootstrap dispatch input."
            exit 1
          elif [ -z "$run_id" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned upstream monitor
        run: go install "github.com/sigstore/rekor-monitor/cmd/rekor_monitor@$MONITOR_VERSION"

      - name: Build single-purpose entry proof verifier
        working-directory: tools/rekor-entry
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/rekor-entry" .

      - name: Verify checkpoint and scan identities
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/rekor_monitor" --once=true --monitor-port=0 \
            --url https://rekor.sigstore.dev \
            --file monitor-state/checkpoint.txt --config-file tools/rekor-monitor.yaml \
            2>&1 | tee monitor-state/diagnostics.log
          touch monitor-state/identities.jsonl

      - name: Check signed digests and checkpoint progress
        env:
          GH_TOKEN: ${{ github.token }}
          REKOR_ENTRY_HELPER: ${{ runner.temp }}/rekor-entry
          MONITOR_BOOTSTRAP: ${{ steps.restore.outputs.bootstrap || false }}
        run: bash scripts/rekor_digest_check.sh

      - name: Check monitor state completeness
        id: state
        if: always()
        run: |
          if [ -s monitor-state/checkpoint.txt ] && [ -s monitor-state/reconciliation.json ]; then
            echo "state_complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist verified checkpoint and reconciliation state
        if: always() && steps.state.outputs.state_complete == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rekor-monitor-state
          path: monitor-state/
          if-no-files-found: error
          retention-days: 30

      - name: Alert delivery placeholder
        if: failure()
        run: |
          echo '::warning::Rekor monitor needs attention. Alert delivery is not wired; intended test channel: #ops-testing-new-alerts.'
