on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
    inputs:
      review_prompt:
        description: "Review prompt profile to use: connector or general"
        required: false
        default: connector
        type: string
      summary_marker:
        description: "Optional override for the review summary heading: a single-line Markdown heading of the form '### ...:'. Empty uses the review_prompt profile's heading."
        required: false
        default: ""
        type: string
      verdict_mode:
        description: "How CI turns the review summary into a formal PR review: 'judge' (the default here — the reviewer writes an APPROVE / REQUEST CHANGES / DEFER verdict, and the action grants it only where the base branch's rulesets confirm 0 required approving reviews), 'baseline' (count-driven, never approves), or 'none' (report only)."
        required: false
        default: judge
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
concurrency:
  group: pr-review-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  pr-review:
    if: github.event_name != 'pull_request' || github.repository != 'ConductorOne/github-workflows'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Report skipped review
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Skipped: Claude review only runs on same-repo PRs."
      - name: Checkout PR head
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout workflow repo
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _workflow
          persist-credentials: false
      - name: Run PR Review
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./_workflow/.github/actions/pr-review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          review_prompt: ${{ inputs.review_prompt || 'connector' }}
          summary_marker: ${{ inputs.summary_marker }}
          # Also the fallback for the direct `pull_request` trigger, where
          # `inputs` is empty: connector repos run this workflow from an org
          # rule, not as a workflow_call, so the input default above never
          # applies to them and this is what selects their mode.
          #
          # Note the asymmetry this creates with the action, which normalizes
          # an explicit "" to baseline: here "" is falsy and lands on judge.
          # That is the right answer for this workflow — "" and "omitted" both
          # mean "whatever the connector profile runs", and that is judge —
          # but a workflow_call caller forwarding its own empty optional input
          # gets judge rather than the action's conservative default. Pass
          # `verdict_mode: baseline` explicitly to opt out.
          verdict_mode: ${{ inputs.verdict_mode || 'judge' }}
    timeout-minutes: 30
