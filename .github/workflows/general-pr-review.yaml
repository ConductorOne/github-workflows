on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
concurrency:
  group: general-pr-review-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  image-locks:
    if: github.event_name == 'pull_request' && github.repository == 'ConductorOne/github-workflows'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test image lock check
        run: python3 scripts/test-check-image-locks.py
      - name: Check image locks
        run: bash scripts/check-image-locks.sh
    timeout-minutes: 5
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Report skipped review
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Skipped: Claude review only runs on same-repo PRs."
      - name: Checkout PR head
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout workflow repo
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _workflow
          persist-credentials: false
      - name: Run PR Review
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./_workflow/.github/actions/pr-review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          review_prompt: general
    timeout-minutes: 30
