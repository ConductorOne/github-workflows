name: PR Review
description: Run Claude-powered PR review with context fetching and thread resolution

inputs:
  anthropic_api_key:
    description: Anthropic API key
    required: true
  github_token:
    description: GitHub token with PR read/write permissions
    required: true
  pr_number:
    description: Pull request number
    required: true
  head_sha:
    description: Expected pull request head SHA
    required: false
  review_prompt:
    description: "Review prompt profile to use: connector or general"
    required: false
    default: connector
  summary_marker:
    description: "Optional override for the review summary heading: a single-line Markdown heading of the form '### ...:'. Empty uses the review_prompt profile's heading."
    required: false
    default: ""

runs:
  using: composite
  steps:
  - name: Resolve review prompt config
    id: review-config
    shell: bash
    env:
      REVIEW_PROMPT: ${{ inputs.review_prompt }}
      SUMMARY_MARKER: ${{ inputs.summary_marker }}
    run: |
      # Captured before any review work: the publication gates require the
      # working summary comment to have been created/updated at or after this
      # moment, so a successful agent step can never launder a prior run's
      # output into this run's report.
      echo "review_run_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
      case "${REVIEW_PROMPT}" in
        ""|"connector")
          echo "built_in_mixins=connector" >> "${GITHUB_OUTPUT}"
          summary_heading="### Connector PR Review:"
          ;;
        "general")
          echo "built_in_mixins=" >> "${GITHUB_OUTPUT}"
          summary_heading="### General PR Review:"
          ;;
        *)
          echo "::error::review_prompt must be 'connector' or 'general'"
          exit 1
          ;;
      esac
      if [ -n "${SUMMARY_MARKER}" ]; then
        # The override is written to GITHUB_OUTPUT below, so validate before
        # writing: it must be one non-empty single-line Markdown heading
        # (### ...:). A newline would smuggle extra output lines; anything
        # else could never match a real summary comment.
        case "${SUMMARY_MARKER}" in
          *$'\n'*|*$'\r'*)
            echo "::error::summary_marker must be a single line"
            exit 1
            ;;
        esac
        if ! printf '%s' "${SUMMARY_MARKER}" | grep -qE '^### [^[:space:]].*:$'; then
          echo "::error::summary_marker must be a Markdown heading of the form '### ...:'"
          exit 1
        fi
        for reserved in "### Connector PR Review:" "### General PR Review:" "### PR Review:"; do
          if [[ "${SUMMARY_MARKER}" != "${reserved}" && "${SUMMARY_MARKER}" == *"${reserved}"* ]]; then
            echo "::error::summary_marker must not embed a reserved review heading"
            exit 1
          fi
        done
        summary_heading="${SUMMARY_MARKER}"
      fi
      echo "summary_heading=${summary_heading}" >> "${GITHUB_OUTPUT}"
  - name: Fetch PR context
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_HEAD_SHA: ${{ inputs.head_sha }}
      REVIEW_SUMMARY_HEADING: ${{ steps.review-config.outputs.summary_heading }}
    run: python3 ${{ github.action_path }}/scripts/fetch-pr-context.py
  - name: Resolve outdated bot review threads
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    run: python3 ${{ github.action_path }}/scripts/resolve-outdated-threads.py
  - name: Load repo-local review criteria
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      REVIEW_CRITERIA_PATH: .claude/skills/ci-review.md
    run: python3 ${{ github.action_path }}/scripts/load-review-criteria.py
  - name: Load review prompt
    id: prompt
    shell: bash
    env:
      BUILT_IN_MIXINS: ${{ steps.review-config.outputs.built_in_mixins }}
    run: |
      DELIM="PROMPT_EOF_$(openssl rand -hex 8)"
      PROMPT_DIR="${GITHUB_ACTION_PATH}/prompts"
      {
        echo "REVIEW_PROMPT<<${DELIM}"
        cat "${PROMPT_DIR}/base-pr-review.md"
        if [ -n "${BUILT_IN_MIXINS}" ]; then
          IFS=',' read -ra MIXINS <<< "${BUILT_IN_MIXINS}"
          for mixin in "${MIXINS[@]}"; do
            echo
            cat "${PROMPT_DIR}/mixins/${mixin}.md"
          done
        fi
        if [ -f ".github/review-criteria.md" ]; then
          echo
          cat ".github/review-criteria.md"
        fi
        echo "${DELIM}"
      } >> "${GITHUB_ENV}"
  - name: Prepare review summary
    id: summary-transport
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REVIEW_SUMMARY_HEADING: ${{ steps.review-config.outputs.summary_heading }}
    # Bind a fresh provisional comment before the model runs. Completed
    # reports remain separate, CI-owned publication output.
    run: python3 ${{ github.action_path }}/scripts/prepare-review-summary.py
  - name: Run Claude PR Review
    id: claude_review
    uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6  # v1.0.234: Claude Code 2.1.282
    env:
      # This is a one-shot SDK turn: required audit agents must return before
      # the parent finishes, rather than wait for a later background wakeup.
      # Keep subagents available, but run their work in the foreground.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      # Agent mode does not create a tracking comment. Its native MCP server
      # inherits this host-created working comment ID from the step environment.
      CLAUDE_COMMENT_ID: ${{ steps.summary-transport.outputs.comment_id }}
    with:
      anthropic_api_key: ${{ inputs.anthropic_api_key }}
      github_token: ${{ inputs.github_token }}
      include_fix_links: true
      # use_sticky_comment is OFF: the review's working summary comment is
      # managed explicitly (the summary-transport step creates a fresh
      # provisional slot per run/attempt and binds it to the native
      # github_comment MCP tool via CLAUDE_COMMENT_ID), and completed reports
      # are published as NEW comments by publish-review-report.py. Sticky
      # reuse must never let claude-code-action's tracking pick up and
      # overwrite a completed report comment.
      use_sticky_comment: false
      allowed_bots: "*"
      # --setting-sources user: do NOT load the reviewed repo's project/local
      # settings. Those register the repo's own .claude/agents and .claude/commands
      # into this run, which is wrong for a read-only CI reviewer: a project
      # agent's model frontmatter can override the pinned model, and its
      # instructions may be oriented toward implementation rather than review.
      # This also unregisters the repo's skills, so Skill is hard-denied below —
      # review criteria already reach the prompt inline via load-review-criteria.
      #
      # --strict-mcp-config: use only the MCP servers claude-code-action itself
      # passes via --mcp-config, ignoring any .mcp.json in the reviewed repo.
      #
      # Loop/scheduling tools (ScheduleWakeup, Cron*) are hard-denied: in a
      # one-shot CI review they are meaningless and harmful — ScheduleWakeup
      # schedules a wakeup no event loop will fire, so the agent ends its turn
      # waiting and posts no summary.
      #
      # Bash(gh pr review:*) is gone from the allow-list: CI publishes the
      # report and submits the verdict deterministically
      # (publish-review-report.py) instead of relying on the agent to run a
      # trailing command, which Claude Code upgrades have repeatedly
      # regressed (the agent stops after the summary and the formal review is
      # never submitted).
      #
      # The working summary is written only through the native
      # mcp__github_comment__update_claude_comment: a body-only tool bound to
      # this run's fixed working slot via the step's CLAUDE_COMMENT_ID (see
      # above), replacing the old heredoc/`gh api` PATCH flow. Bash(gh api:*)
      # stays granted for metadata reads; the prompt forbids using it (or any
      # shell path) to create or edit comments.
      claude_args: --model claude-opus-5-5 --max-turns 100 --setting-sources user --strict-mcp-config --disallowedTools "Skill,ScheduleWakeup,CronCreate,CronDelete,CronList" --allowedTools "Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
      prompt: ${{ env.REVIEW_PROMPT }}
  - name: Publish review report and verdict
    id: publish
    # CI finalizes the run deterministically rather than relying on the agent
    # to stamp metadata or run `gh pr review` itself (those trailing model
    # steps regressed repeatedly — the agent stops after the summary and the
    # formal review is never submitted). This step:
    # 1. selects THIS run's fresh, final working summary (never a completed
    #    report — those are CI-published output the model must not mutate —
    #    and never output already consumed by a published report), refusing
    #    as obsolete when a later attempt already completed (actual attempt
    #    start times, never run-ID order),
    # 2. validates the baseline count row and that the live PR head still
    #    equals the reviewed checkout,
    # 3. POSTs a NEW report comment (publication: pending) carrying a visible
    #    reviewed-commit link and CI-owned review-state metadata identifying
    #    the publication (workflow + marker + mode + run + attempt + head),
    # 4. submits the formal PR review with an explicit commit_id, linking
    #    directly to the report — baseline mode only: request changes on
    #    blocking findings, neutral comment otherwise, never approves,
    # 5. transitions the report to publication: completed — a completed
    #    report is the report PLUS its formal result, so a report whose
    #    review never landed stays pending and never becomes review state,
    # 6. only then collapses the superseded previous report(s) and the
    #    consumed working comment (bodies retained, linked to the new
    #    report).
    # Publication is idempotent per run/attempt: a repeated finalization
    # reconciles the published report and review by identity and never
    # submits a second review. Any gate failure exits nonzero — a broken
    # review is a loud red check, not silent green.
    if: steps.claude_review.conclusion == 'success'
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      SUMMARY_MARKER: ${{ steps.review-config.outputs.summary_heading }}
      REVIEW_RUN_STARTED_AT: ${{ steps.review-config.outputs.review_run_started_at }}
    run: python3 ${{ github.action_path }}/scripts/publish-review-report.py
  - name: Upload review context artifacts
    if: always()
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: pr-review-context
      path: |
        .github/pr-context.json
        .github/resolved-threads.json
        .github/prior-findings.json
        .github/incremental.diff
        .github/review-criteria.md
        .github/review-criteria.json
      retention-days: 7
