name: PR Review
description: Run Claude-powered PR review with context fetching and thread resolution

inputs:
  anthropic_api_key:
    description: Anthropic API key
    required: true
  github_token:
    description: GitHub token with PR read/write permissions
    required: true
  pr_number:
    description: Pull request number
    required: true
  head_sha:
    description: Expected pull request head SHA
    required: false
  review_prompt:
    description: "Review prompt profile to use: connector or general"
    required: false
    default: connector
  doc_fetch_domains:
    description: >-
      Comma-separated bare hostnames the reviewer may fetch vendor API documentation from,
      e.g. "developer.okta.com,docs.okta.com". Empty (the default) means WebFetch is not
      granted at all. Only honored for the connector profile.
    required: false
    default: ""

runs:
  using: composite
  steps:
  - name: Resolve review prompt config
    id: review-config
    shell: bash
    env:
      REVIEW_PROMPT: ${{ inputs.review_prompt }}
      DOC_FETCH_DOMAINS: ${{ inputs.doc_fetch_domains }}
    run: |
      case "${REVIEW_PROMPT}" in
        ""|"connector")
          echo "built_in_mixins=connector" >> "${GITHUB_OUTPUT}"
          echo "summary_heading=### Connector PR Review:" >> "${GITHUB_OUTPUT}"
          ALLOW_DOC_FETCH=1
          ;;
        "general")
          echo "built_in_mixins=" >> "${GITHUB_OUTPUT}"
          echo "summary_heading=### General PR Review:" >> "${GITHUB_OUTPUT}"
          ALLOW_DOC_FETCH=0
          ;;
        *)
          echo "::error::review_prompt must be 'connector' or 'general'"
          exit 1
          ;;
      esac

      # WebFetch is granted only to the connector profile, and only for the domains the
      # calling repo explicitly allowlists. Empty doc_fetch_domains means no WebFetch at
      # all: this fails closed, so a repo that has not opted in reviews exactly as before.
      EXTRA_TOOLS=""
      if [ "${ALLOW_DOC_FETCH}" = "1" ] && [ -n "${DOC_FETCH_DOMAINS}" ]; then
        IFS=',' read -ra DOC_DOMAINS <<< "${DOC_FETCH_DOMAINS}"
        for domain in "${DOC_DOMAINS[@]}"; do
          domain="$(printf '%s' "${domain}" | tr -d '[:space:]')"
          if [ -z "${domain}" ]; then
            continue
          fi
          # Bare hostnames only. This value is interpolated into the --allowedTools string,
          # so reject anything carrying quotes, spaces, schemes, paths, or globs.
          if ! printf '%s' "${domain}" | grep -qE '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'; then
            echo "::error::doc_fetch_domains entry is not a bare hostname: ${domain}"
            exit 1
          fi
          EXTRA_TOOLS="${EXTRA_TOOLS},WebFetch(domain:${domain})"
        done
      elif [ "${ALLOW_DOC_FETCH}" != "1" ] && [ -n "${DOC_FETCH_DOMAINS}" ]; then
        echo "::notice::doc_fetch_domains is ignored for the '${REVIEW_PROMPT}' profile."
      fi
      echo "extra_tools=${EXTRA_TOOLS}" >> "${GITHUB_OUTPUT}"

      if [ -n "${EXTRA_TOOLS}" ]; then
        echo "Vendor doc fetching enabled for: ${DOC_FETCH_DOMAINS}"
      else
        echo "Vendor doc fetching disabled: no doc_fetch_domains configured."
      fi
  - name: Fetch PR context
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_HEAD_SHA: ${{ inputs.head_sha }}
      REVIEW_SUMMARY_HEADING: ${{ steps.review-config.outputs.summary_heading }}
    run: python3 ${{ github.action_path }}/scripts/fetch-pr-context.py
  - name: Resolve outdated bot review threads
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    run: python3 ${{ github.action_path }}/scripts/resolve-outdated-threads.py
  - name: Load repo-local review criteria
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      REVIEW_CRITERIA_PATH: .claude/skills/ci-review.md
    run: python3 ${{ github.action_path }}/scripts/load-review-criteria.py
  - name: Load review prompt
    id: prompt
    shell: bash
    env:
      BUILT_IN_MIXINS: ${{ steps.review-config.outputs.built_in_mixins }}
    run: |
      DELIM="PROMPT_EOF_$(openssl rand -hex 8)"
      PROMPT_DIR="${GITHUB_ACTION_PATH}/prompts"
      {
        echo "REVIEW_PROMPT<<${DELIM}"
        cat "${PROMPT_DIR}/base-pr-review.md"
        if [ -n "${BUILT_IN_MIXINS}" ]; then
          IFS=',' read -ra MIXINS <<< "${BUILT_IN_MIXINS}"
          for mixin in "${MIXINS[@]}"; do
            echo
            cat "${PROMPT_DIR}/mixins/${mixin}.md"
          done
        fi
        if [ -f ".github/review-criteria.md" ]; then
          echo
          cat ".github/review-criteria.md"
        fi
        echo "${DELIM}"
      } >> "${GITHUB_ENV}"
  - name: Run Claude PR Review
    uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341  # v1.0.185
    with:
      anthropic_api_key: ${{ inputs.anthropic_api_key }}
      github_token: ${{ inputs.github_token }}
      include_fix_links: true
      use_sticky_comment: true
      allowed_bots: "*"
      claude_args: --model claude-opus-5 --max-turns 100 --allowedTools "Read,Glob,Grep,Skill,Task,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*)${{ steps.review-config.outputs.extra_tools }}"
      prompt: ${{ env.REVIEW_PROMPT }}
  - name: Upload review context artifacts
    if: always()
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: pr-review-context
      path: |
        .github/pr-context.json
        .github/resolved-threads.json
        .github/incremental.diff
        .github/review-criteria.md
        .github/review-criteria.json
      retention-days: 7
