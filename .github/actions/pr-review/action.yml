name: PR Review
description: Run Claude-powered PR review with context fetching and thread resolution

inputs:
  anthropic_api_key:
    description: Anthropic API key
    required: true
  github_token:
    description: GitHub token with PR read/write permissions
    required: true
  pr_number:
    description: Pull request number
    required: true
  head_sha:
    description: Expected pull request head SHA
    required: false
  review_prompt:
    description: "Review prompt profile to use: connector or general"
    required: false
    default: connector

runs:
  using: composite
  steps:
  - name: Resolve review prompt config
    id: review-config
    shell: bash
    env:
      REVIEW_PROMPT: ${{ inputs.review_prompt }}
    run: |
      case "${REVIEW_PROMPT}" in
        ""|"connector")
          echo "built_in_mixins=connector" >> "${GITHUB_OUTPUT}"
          echo "summary_heading=### Connector PR Review:" >> "${GITHUB_OUTPUT}"
          ;;
        "general")
          echo "built_in_mixins=" >> "${GITHUB_OUTPUT}"
          echo "summary_heading=### General PR Review:" >> "${GITHUB_OUTPUT}"
          ;;
        *)
          echo "::error::review_prompt must be 'connector' or 'general'"
          exit 1
          ;;
      esac
  - name: Fetch PR context
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_HEAD_SHA: ${{ inputs.head_sha }}
      REVIEW_SUMMARY_HEADING: ${{ steps.review-config.outputs.summary_heading }}
    run: python3 ${{ github.action_path }}/scripts/fetch-pr-context.py
  - name: Resolve outdated bot review threads
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    run: python3 ${{ github.action_path }}/scripts/resolve-outdated-threads.py
  - name: Load repo-local review criteria
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      REVIEW_CRITERIA_PATH: .claude/skills/ci-review.md
    run: python3 ${{ github.action_path }}/scripts/load-review-criteria.py
  - name: Load review prompt
    id: prompt
    shell: bash
    env:
      BUILT_IN_MIXINS: ${{ steps.review-config.outputs.built_in_mixins }}
    run: |
      DELIM="PROMPT_EOF_$(openssl rand -hex 8)"
      PROMPT_DIR="${GITHUB_ACTION_PATH}/prompts"
      {
        echo "REVIEW_PROMPT<<${DELIM}"
        cat "${PROMPT_DIR}/base-pr-review.md"
        if [ -n "${BUILT_IN_MIXINS}" ]; then
          IFS=',' read -ra MIXINS <<< "${BUILT_IN_MIXINS}"
          for mixin in "${MIXINS[@]}"; do
            echo
            cat "${PROMPT_DIR}/mixins/${mixin}.md"
          done
        fi
        if [ -f ".github/review-criteria.md" ]; then
          echo
          cat ".github/review-criteria.md"
        fi
        echo "${DELIM}"
      } >> "${GITHUB_ENV}"
  - name: Run Claude PR Review
    id: claude-review
    uses: anthropics/claude-code-action@661a6fefbd0569ef35809da16775508ab1937862
    with:
      anthropic_api_key: ${{ inputs.anthropic_api_key }}
      github_token: ${{ inputs.github_token }}
      include_fix_links: true
      use_sticky_comment: true
      allowed_bots: "*"
      claude_args: >-
        --model claude-opus-4-8
        --max-turns 100
        --allowedTools "Read,Glob,Grep,Task,Bash(gh pr diff:*),Bash(gh pr view:*)"
        --disallowedTools "Edit,MultiEdit,Write,NotebookEditCell,mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git:*),Bash(gh api:*),Bash(gh pr review:*)"
        --json-schema '{"type":"object","additionalProperties":false,"required":["review_summary","security_issues","correctness_issues","suggestions"],"properties":{"review_summary":{"type":"string"},"security_issues":{"type":"array","items":{"$ref":"#/definitions/finding"}},"correctness_issues":{"type":"array","items":{"$ref":"#/definitions/finding"}},"suggestions":{"type":"array","items":{"$ref":"#/definitions/finding"}}},"definitions":{"finding":{"type":"object","additionalProperties":false,"required":["path","line","confidence","summary","details"],"properties":{"path":{"type":"string"},"line":{"type":"integer","minimum":1},"confidence":{"type":"string","enum":["high","medium","low"]},"summary":{"type":"string"},"details":{"type":"string"}}}}'
      prompt: ${{ env.REVIEW_PROMPT }}
  - name: Publish review output
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      CLAUDE_REVIEW_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
    run: python3 ${{ github.action_path }}/scripts/publish-review-output.py
  - name: Upload review context artifacts
    if: always()
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: pr-review-context
      path: |
        .github/pr-context.json
        .github/resolved-threads.json
        .github/incremental.diff
        .github/review-criteria.md
        .github/review-criteria.json
        .github/review-output.json
      retention-days: 7
